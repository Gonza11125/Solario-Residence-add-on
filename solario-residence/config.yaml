name: Solario Residence Local
version: "0.3.0"
slug: solario_residence
description: Local integration and cloud bridge for apartment-building energy management
url: https://solario.cloud
arch:
  - aarch64
  - amd64
image: ghcr.io/gonza11125/solario-residence
webui: http://[HOST]:[PORT:3000]
ports:
  3000/tcp: null
ports_description:
  3000/tcp: Optional direct LAN administration access (disabled by default)
startup: application
boot: auto
stage: experimental
backup: hot
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:office-building-cog
panel_title: Solario Residence Local
panel_admin: true
homeassistant_api: true
options:
  log_level: info
  cloud_url: https://solario.cloud
  sync_interval: 15
  residence_name: Moje rezidence
  local_site_id: local-site
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  cloud_url: url
  sync_interval: int(5,300)
  residence_name: str
  local_site_id: str
environment:
  NODE_ENV: production
